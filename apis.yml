aid: career-karma
name: Career Karma
description: 'Career Karma is a consumer edtech platform that helps people find and
  compare career training programs and get matched to the right one based on their
  goals, learning style, schedule, and budget. Its catalog spans technology paths
  (coding bootcamps, software engineering, data science, cybersecurity, AI, UX design),
  skilled trades (CDL truck driving, HVAC, electrical), healthcare, beauty, and sales,
  alongside rankings, school comparisons, financing guidance (scholarships, deferred
  tuition, GI Bill), and a resource center of career guides. Backed by GV, Career
  Karma runs a guided quiz-and-advisor matching experience rather than a public developer
  API; this profile captures the company identity and the security and link surface
  probed from its public web properties.'
